name: Daily pipeline run

# Runs the full ETL pipeline after the US market closes on each trading day,
# then commits the refreshed dataset, chart and README stats back to the repo.
on:
  schedule:
    - cron: "47 22 * * 1-5"   # 22:47 UTC, Mon–Fri (after the 21:00 UTC US close)
  workflow_dispatch:          # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run pipeline
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          if [ -z "$ALPHA_VANTAGE_API_KEY" ]; then
            echo "::error::Repository secret ALPHA_VANTAGE_API_KEY is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          python run_pipeline.py

      - name: Commit updated data
        run: |
          # Authored with the account's GitHub noreply address so the commit
          # is attributed to the profile (bot-authored commits are not).
          git config user.name  "Priyanshu Thakur"
          git config user.email "212137460+priyanshuthakkur@users.noreply.github.com"

          git add data/history/ outputs/ README.md
          if git diff --cached --quiet; then
            echo "No new market data since the last run, nothing to commit."
            exit 0
          fi

          rows=$(($(wc -l < data/history/price_history.csv) - 1))
          latest=$(tail -n 1 data/history/price_history.csv | cut -d, -f1)
          git commit -m "data: daily price update through ${latest} (${rows} rows)"
          git push
